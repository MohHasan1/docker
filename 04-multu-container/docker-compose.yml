version: '3'
services: 
  postgres:
    image: 'postgres:latest'
    environment:
      - POSTGRES_PASSWORD=postgres_password
  redis:
    image: 'redis:latest'
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    volumes:
      - /app/node_modules
      - ./server:/app
    environment: 
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PGUSER=postgres
      - PGHOST=postgres
      - PGDATABASE=postgres
      - PGPASSWORD=postgres_password
      - PGPORT=5432
  client:
    build: 
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./app/node_module
      - ./client:./app
  worker:
    build: 
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./app/node_module
      - ./worker:./app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
  nginx: 
